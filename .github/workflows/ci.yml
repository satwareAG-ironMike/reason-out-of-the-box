name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  archive-consistency:
    name: archive consistency + provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Selftest (negative control)
        run: python3 scripts/check_archive.py --selftest
      - name: Metrics report
        run: python3 scripts/check_archive.py --report
      - name: Consistency check
        run: python3 scripts/check_archive.py

  markdown-hygiene:
    name: markdown hygiene (dashes + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No em/en dashes in tracked files
        run: '! git grep -n -P "\x{2014}|\x{2013}" -- .'
      - name: Relative markdown links resolve
        run: |
          python3 scripts/check_links.py --selftest
          python3 scripts/check_links.py

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks version
      - name: Scan git history
        run: /tmp/gitleaks detect --redact
