# gitleaks v8.30.1 config for this repository.
# CI runs `gitleaks detect` on full history; this allowlist excludes the
# false-positive class that gitleaks' generic-api-key rule catches: gate-row
# ids (issue #137 shape) that carry a V-number prefix and an underscored
# descriptor (e.g. `V5_delivery_census`). These are row labels, not secrets.

title = "repo gitleaks config"

[allowlist]
    description = "gate-row ids (issue #137 shape) are labels, not secrets"
    regexes = [
        # a gate-row id: V + digits + _ + lowercase snake_case, on its own
        # line in a gate.json file
        '^\s*"?V\d+_[a-z_]+"?\s*[:=]',
    ]
    paths = [
        '.*gate\.json$',
    ]
